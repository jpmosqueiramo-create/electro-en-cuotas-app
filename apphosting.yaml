# Firebase App Hosting Configuration
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: negocio-facil-page
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: negocio-facil-page.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: negocio-facil-page.appspot.com
